# Neo4j backend for Graphiti (Tier 3). Isolated container + named volume.
services:
  neo4j-graphiti:
    image: neo4j:5.26
    container_name: brain-graphiti-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-falconbrain}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - graphiti_neo4j_data:/data

volumes:
  graphiti_neo4j_data:
